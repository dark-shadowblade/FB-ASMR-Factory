name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "services/orchestrator/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "services/orchestrator/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies and packager
        working-directory: services/orchestrator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run backend tests
        working-directory: services/orchestrator
        run: python -m unittest discover -s tests -v

      - name: Package backend executable
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name asmr-orchestrator --paths services/orchestrator --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all uvicorn --hidden-import app.main services/orchestrator/launcher.py
          New-Item -ItemType Directory -Force apps/desktop/backend | Out-Null
          Copy-Item -Recurse dist/asmr-orchestrator apps/desktop/backend/asmr-orchestrator

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ASMR-Factory-Windows-Installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
